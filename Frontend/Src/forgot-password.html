<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Forgot Password - Admin Assist</title>
  <meta name="description" content="Request a password reset link for your Admin Assist account.">
  <link rel="stylesheet" href="login.css">
</head>
<body>
  <div class="login-container">
    <div class="login-header">
      <div class="login-logo">AA</div>
      <h1>Forgot Password</h1>
      <p>Enter your email and we will send you a reset link.</p>
    </div>

    <div id="form-banner" class="error-banner" role="alert" aria-live="polite"></div>

    <form id="forgotForm" novalidate>
      <div class="form-group">
        <label for="email">Email Address</label>
        <input type="email" id="email" name="email" placeholder="Enter your registered email"
          required autocomplete="email">
      </div>
      <button type="submit" class="login-btn" id="submitBtn">Send Reset Link</button>
    </form>

    <div class="signup-link">
      <p>Remembered your password? <a href="login.html">Back to Login</a></p>
    </div>
  </div>

  <script src="auth.js"></script>
  <script src="forgot-password.js"></script>
</body>
</html>
