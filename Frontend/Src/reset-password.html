<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reset Password - Admin Assist</title>
  <meta name="description" content="Set a new password for your Admin Assist account.">
  <link rel="stylesheet" href="login.css">
</head>
<body>
  <div class="login-container">
    <div class="login-header">
      <div class="login-logo">AA</div>
      <h1>Reset Password</h1>
      <p>Enter and confirm your new password below.</p>
    </div>

    <div id="form-banner" class="error-banner" role="alert" aria-live="polite"></div>

    <form id="resetForm" novalidate>
      <div class="form-group">
        <label for="newPassword">New Password</label>
        <div class="input-wrap">
          <input type="password" id="newPassword" name="newPassword"
            placeholder="At least 8 characters" minlength="8" required autocomplete="new-password">
          <button type="button" class="toggle-pw" id="togglePw1" aria-label="Show password">&#128065;</button>
        </div>
      </div>
      <div class="form-group">
        <label for="confirmPassword">Confirm Password</label>
        <div class="input-wrap">
          <input type="password" id="confirmPassword" name="confirmPassword"
            placeholder="Repeat new password" minlength="8" required autocomplete="new-password">
          <button type="button" class="toggle-pw" id="togglePw2" aria-label="Show password">&#128065;</button>
        </div>
      </div>
      <button type="submit" class="login-btn" id="resetBtn">Reset Password</button>
    </form>

    <div class="signup-link">
      <p><a href="login.html">Back to Login</a></p>
    </div>
  </div>

  <script src="auth.js"></script>
  <script src="reset-password.js"></script>
</body>
</html>
