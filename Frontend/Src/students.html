<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Students — Admin Assist</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="theme.css" />
  <link rel="stylesheet" href="navigation.css" />
  <link rel="stylesheet" href="students.css" />
</head>

<body data-page="students">

  <main class="main-container" id="main-content">

    <div class="pg-header">
      <div>
        <h1>Students</h1>
        <p>Manage all enrolled students across every class.</p>
      </div>
      <div class="pg-header-actions">
        <a href="enroll-student.html" class="pg-btn-primary">+ Add Student</a>
      </div>
    </div>

    <div class="pg-table-card">

      <div class="pg-toolbar">
        <div class="pg-search-wrap">
          <svg width="16" height="16" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
            <circle cx="11" cy="11" r="8" />
            <line x1="21" y1="21" x2="16.65" y2="16.65" />
          </svg>
          <input class="pg-search" type="search" id="studentSearch" placeholder="Search students…" autocomplete="off" />
        </div>
        <select class="pg-filter" id="classFilter">
          <option value="">All Classes</option>
        </select>
        <select class="pg-filter" id="statusFilter">
          <option value="">All Status</option>
          <option value="Active">Active</option>
          <option value="Inactive">Inactive</option>
          <option value="Suspended">Suspended</option>
        </select>
        <div class="pg-toolbar-right">
          <span class="pg-count" id="studentCount">— students</span>
        </div>
      </div>

      <div class="pg-table-wrap">
        <table class="pg-table" id="studentsTable">
          <thead>
            <tr>
              <th>#</th>
              <th>Student</th>
              <th>Admission No</th>
              <th>Class</th>
              <th>Gender</th>
              <th>Enrolled</th>
              <th>Status</th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody id="studentsBody">
            <tr>
              <td colspan="8" class="pg-loading">Loading students…</td>
            </tr>
          </tbody>
        </table>
      </div>

      <div class="pg-pagination" id="paginationBar">
        <span id="paginationInfo">Showing 1–10 of —</span>
        <div class="pg-page-btns" id="paginationBtns"></div>
      </div>

    </div>

  </main>

  <!-- ── View / Edit Student Modal ───────────────────────────────── -->
  <div class="pg-modal-backdrop" id="studentModal" hidden>
    <div class="pg-modal">
      <div class="pg-modal-header">
        <h2 class="pg-modal-title" id="modalTitle">Student Details</h2>
        <button class="pg-modal-close" id="closeModalBtn" type="button" aria-label="Close">×</button>
      </div>
      <div class="pg-modal-body">
        <input type="hidden" id="editStudentId" />
        <div class="pg-form-grid">
          <div class="pg-form-group">
            <label class="pg-form-label" for="fFirstName">First Name *</label>
            <input class="pg-form-control" type="text" id="fFirstName" placeholder="e.g. John" />
          </div>
          <div class="pg-form-group">
            <label class="pg-form-label" for="fLastName">Last Name *</label>
            <input class="pg-form-control" type="text" id="fLastName" placeholder="e.g. Mulenga" />
          </div>
          <div class="pg-form-group">
            <label class="pg-form-label" for="fAdmNo">Admission Number *</label>
            <input class="pg-form-control" type="text" id="fAdmNo" placeholder="e.g. 2025/001" />
          </div>
          <div class="pg-form-group">
            <label class="pg-form-label" for="fGender">Gender</label>
            <select class="pg-form-control" id="fGender">
              <option value="">Select…</option>
              <option value="Male">Male</option>
              <option value="Female">Female</option>
            </select>
          </div>
          <div class="pg-form-group">
            <label class="pg-form-label" for="fDOB">Date of Birth</label>
            <input class="pg-form-control" type="date" id="fDOB" />
          </div>
          <div class="pg-form-group">
            <label class="pg-form-label" for="fClass">Class</label>
            <select class="pg-form-control" id="fClass">
              <option value="">Select Class…</option>
            </select>
          </div>
          <div class="pg-form-group pg-form-full">
            <label class="pg-form-label" for="fGuardian">Guardian Name</label>
            <input class="pg-form-control" type="text" id="fGuardian" placeholder="e.g. Mary Mulenga" />
          </div>
          <div class="pg-form-group">
            <label class="pg-form-label" for="fGuardianPhone">Guardian Phone</label>
            <input class="pg-form-control" type="tel" id="fGuardianPhone" placeholder="+260 9X XXXXXXX" />
          </div>
          <div class="pg-form-group">
            <label class="pg-form-label" for="fStatus">Status</label>
            <select class="pg-form-control" id="fStatus">
              <option value="Active">Active</option>
              <option value="Inactive">Inactive</option>
              <option value="Suspended">Suspended</option>
            </select>
          </div>
        </div>
      </div>
      <div class="pg-modal-footer">
        <button class="pg-btn-ghost" id="cancelModalBtn" type="button">Cancel</button>
        <button class="pg-btn-primary" id="saveStudentBtn" type="button">Save Changes</button>
      </div>
    </div>
  </div>

  <!-- ── Delete Confirm Modal ─────────────────────────────────────── -->
  <div class="pg-modal-backdrop" id="deleteModal" hidden>
    <div class="pg-modal pg-modal-sm">
      <div class="pg-modal-header">
        <h2 class="pg-modal-title">Remove Student</h2>
        <button class="pg-modal-close" id="closeDeleteBtn" type="button" aria-label="Close">×</button>
      </div>
      <div class="pg-modal-body">
        <p class="pg-confirm-text">Are you sure you want to remove <strong id="deleteStudentName">this student</strong>?
          This action cannot be undone.</p>
      </div>
      <div class="pg-modal-footer">
        <button class="pg-btn-ghost" id="cancelDeleteBtn" type="button">Cancel</button>
        <button class="pg-btn-danger" id="confirmDeleteBtn" type="button">Yes, Remove</button>
      </div>
    </div>
  </div>

  <div id="toast-container"></div>
  <script src="auth.js"></script>
  <script src="auth-guard.js"></script>
  <script src="navigation.js"></script>
  <script src="students.js"></script>
</body>

</html>
