<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Notifications - Admin Assist</title>
  <meta name="description" content="View system notifications, alerts, announcements, and activity logs.">
  <link rel="stylesheet" href="theme.css">
  <link rel="stylesheet" href="aa-shared.css">
  <link rel="stylesheet" href="navigation.css">
  <style>
    .notif-filter-bar {
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
      border-bottom: 2px solid var(--aa-border, #e2e8f0);
      padding-bottom: 10px;
    }
    .notif-tab-btn {
      padding: 8px 16px;
      border: none;
      background: transparent;
      font-size: 13px;
      font-weight: 600;
      color: var(--aa-text-muted, #64748b);
      cursor: pointer;
      border-radius: 6px;
      transition: all .15s;
    }
    .notif-tab-btn.is-active {
      background: var(--primary-navy, #06204A);
      color: #ffffff;
    }
    .notif-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .notif-card {
      background: var(--aa-surface, #ffffff);
      border: 1px solid var(--aa-border, #e2e8f0);
      border-radius: 10px;
      padding: 16px 20px;
      display: flex;
      align-items: flex-start;
      gap: 16px;
      box-shadow: 0 1px 3px rgba(0,0,0,.04);
      transition: border-color .15s;
    }
    .notif-card.unread {
      border-left: 4px solid var(--royal-blue, #174A8B);
      background: #f8fafc;
    }
    .notif-icon-box {
      width: 40px;
      height: 40px;
      border-radius: 10px;
      background: var(--light-blue, #EEF4FA);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      flex-shrink: 0;
    }
    .notif-content {
      flex: 1;
    }
    .notif-title {
      font-size: 14px;
      font-weight: 700;
      color: var(--text-navy, #102A56);
      margin-bottom: 4px;
    }
    .notif-desc {
      font-size: 13px;
      color: var(--text-gray, #64748B);
      margin-bottom: 6px;
    }
    .notif-meta {
      font-size: 11px;
      color: #94a3b8;
    }
    .notif-badge {
      font-size: 10px;
      font-weight: 700;
      padding: 2px 8px;
      border-radius: 999px;
      background: #e2e8f0;
      color: #475569;
    }
  </style>
</head>

<body data-page="notifications">
  <div id="navigation-root"></div>

  <main class="aa-main">
    <header class="aa-page-header">
      <div>
        <p class="aa-kicker">Communication</p>
        <h1>Notifications &amp; Announcements</h1>
        <p class="aa-subtitle">System alerts, academic notices, attendance reminders, and audit activities.</p>
      </div>
      <div class="aa-header-actions">
        <button class="aa-btn aa-btn-secondary" id="markAllReadBtn">Mark All as Read</button>
      </div>
    </header>

    <div class="notif-filter-bar">
      <button class="notif-tab-btn is-active" data-filter="all">All Notifications</button>
      <button class="notif-tab-btn" data-filter="unread">Unread</button>
      <button class="notif-tab-btn" data-filter="announcements">Announcements</button>
      <button class="notif-tab-btn" data-filter="system">System Logs</button>
    </div>

    <div class="notif-list" id="notificationsContainer">
      <div style="padding: 24px; text-align: center; color: var(--aa-text-muted, #64748b); font-size: 13px;">
        Loading system notifications…
      </div>
    </div>
  </main>

  <script src="loader.js"></script>
  <script src="auth.js"></script>
  <script src="auth-guard.js"></script>
  <script src="navigation.js"></script>
  <script>
    let allNotifs = [];
    let currentFilter = 'all';

    document.addEventListener('DOMContentLoaded', async () => {
      await loadNotifs();

      document.querySelectorAll('.notif-tab-btn').forEach(btn => {
        btn.addEventListener('click', function() {
          document.querySelectorAll('.notif-tab-btn').forEach(b => b.classList.remove('is-active'));
          this.classList.add('is-active');
          currentFilter = this.dataset.filter || 'all';
          filterAndRender();
        });
      });

      const markBtn = document.getElementById('markAllReadBtn');
      if (markBtn) {
        markBtn.addEventListener('click', async () => {
          await apiFetch('/api/notifications/read-all', { method: 'POST' }).catch(() => {});
          allNotifs.forEach(n => n.read = true);
          filterAndRender();
          if (typeof _loadNotifications === 'function') _loadNotifications();
        });
      }
    });

    async function loadNotifs() {
      try {
        const res = await apiFetch('/api/notifications');
        if (res && res.ok) {
          const data = await res.json();
          allNotifs = data.notifications || [];
          filterAndRender();
        } else {
          renderNotifications([]);
        }
      } catch (err) {
        console.warn("Could not load notifications API:", err.message);
        renderNotifications([]);
      }
    }

    function filterAndRender() {
      let filtered = allNotifs;
      if (currentFilter === 'unread') {
        filtered = allNotifs.filter(n => !n.read);
      } else if (currentFilter === 'announcements') {
        filtered = allNotifs.filter(n => (n.type || '').includes('announc') || (n.category || '').includes('announc'));
      } else if (currentFilter === 'system') {
        filtered = allNotifs.filter(n => (n.type || '').includes('audit') || (n.type || '').includes('system') || (n.category || '').includes('system') || (n.id && String(n.id).startsWith('audit')));
      }
      renderNotifications(filtered);
    }

    function renderNotifications(items) {
      const container = document.getElementById('notificationsContainer');
      if (!container) return;

      if (!items || items.length === 0) {
        container.innerHTML = `
          <div style="padding: 40px 20px; text-align: center; color: var(--aa-text-muted, #64748b); font-size: 13.5px;">
            🔔 No notifications match the selected filter.
          </div>`;
        return;
      }

      container.innerHTML = items.map(n => `
        <div class="notif-card ${n.read ? '' : 'unread'}" data-id="${_esc(n.id)}" style="cursor:pointer">
          <div class="notif-icon-box">${_getIcon(n.type || n.category)}</div>
          <div class="notif-content">
            <div class="notif-title">${_esc(n.title)}</div>
            <div class="notif-desc">${_esc(n.description)}</div>
            <div class="notif-meta">${n.timestamp ? new Date(n.timestamp).toLocaleString() : ''} &bull; <span class="notif-badge">${_esc(n.category || 'General')}</span></div>
          </div>
        </div>
      `).join('');

      container.querySelectorAll('.notif-card').forEach(card => {
        card.addEventListener('click', async function() {
          const id = this.dataset.id;
          if (id && this.classList.contains('unread')) {
            this.classList.remove('unread');
            const found = allNotifs.find(x => String(x.id) === String(id));
            if (found) found.read = true;
            await apiFetch('/api/notifications/' + id + '/read', { method: 'PATCH' }).catch(() => {});
          }
        });
      });
    }

    function _getIcon(type) {
      const t = String(type || '').toLowerCase();
      if (t.includes('announc')) return '📢';
      if (t.includes('attendance')) return '📋';
      if (t.includes('enroll') || t.includes('student') || t.includes('teacher') || t.includes('user')) return '👤';
      if (t.includes('academic') || t.includes('result') || t.includes('subject')) return '🎓';
      return '🔔';
    }
    function _esc(str) { return String(str || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'); }
  </script>
</body>

</html>
